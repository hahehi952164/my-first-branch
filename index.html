<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152f">
  <meta name="description" content="用 GitHub Copilot 製作的第一個個人介紹網頁。">
  <title>你好，歡迎來到我的小天地</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #07152f;
      color: #f4f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 15%, rgba(73, 113, 226, .22), transparent 38%),
        radial-gradient(ellipse at 88% 82%, rgba(72, 196, 209, .13), transparent 34%),
        #07152f;
    }

    .card {
      position: relative;
      width: min(100%, 620px);
      padding: clamp(36px, 8vw, 64px);
      overflow: hidden;
      text-align: center;
      border: 1px solid rgba(187, 207, 255, .18);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(22, 42, 81, .94), rgba(13, 28, 57, .96));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .06);
      animation: rise-in .7s ease-out both;
    }

    .card::before {
      position: absolute;
      top: 0;
      left: 16%;
      width: 68%;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(143, 191, 255, .9), transparent);
    }

    .sparkle {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 25px;
      place-items: center;
      border: 1px solid rgba(163, 199, 255, .25);
      border-radius: 22px;
      background: rgba(99, 145, 255, .12);
      font-size: 30px;
      box-shadow: 0 0 36px rgba(89, 143, 255, .14);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #94b9ff;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.65rem);
      line-height: 1.45;
      letter-spacing: .02em;
      text-wrap: balance;
    }

    .description {
      max-width: 410px;
      margin: 20px auto 30px;
      color: #b7c5df;
      font-size: 1rem;
      line-height: 1.9;
    }

    button {
      min-height: 52px;
      padding: 0 26px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(110deg, #83b4ff, #87e2e4);
      color: #081832;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(92, 163, 255, .2);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    button:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 14px 32px rgba(92, 163, 255, .3); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    .signature {
      margin: 30px 0 0;
      color: #788baa;
      font-size: .83rem;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little introduction</p>
    <h1>你好，這是我用 GitHub Copilot 做的第一個網頁</h1>
    <p class="description">歡迎來到我的小天地！這是我的第一個個人介紹頁面，未來還會有更多有趣的作品，敬請期待。</p>
    <button type="button" id="welcome-button">點我收下歡迎訊息 <span aria-hidden="true">✧</span></button>
    <p class="signature">用好奇心開始，讓靈感繼續發光。</p>
  </main>

  <script>
    document.getElementById("welcome-button").addEventListener("click", () => {
      window.alert("歡迎來到我的網頁！很高興你來看看 ✨");
    });
  </script>
</body>
</html>
